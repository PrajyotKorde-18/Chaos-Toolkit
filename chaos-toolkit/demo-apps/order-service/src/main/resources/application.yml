server:
  port: 8080

spring:
  application:
    name: order-service

services:
  payment:
    url: http://localhost:8081
  inventory:
    url: http://localhost:8082

chaos:
  agent:
    enabled: true
    service-name: order-service
    control-plane-url: http://localhost:9000
    poll-interval-ms: 2000

logging:
  level:
    in.strikes: DEBUG
